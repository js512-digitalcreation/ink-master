<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d11">
<title>Offline · Ink Masters</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0c0d11; color: #f1eee8;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
         padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
  main { display: grid; gap: 14px; justify-items: center; max-width: 320px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #9b9da7; line-height: 1.5; }
  button { height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: #45b8a5; color: #04201a; font: inherit; font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Ink Masters needs a connection to load artists and bookings. Check your signal and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
